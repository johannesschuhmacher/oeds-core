name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone this repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install python lint dependencies
        run: python -m pip install ruff pandas requests sqlalchemy pyyaml tqdm openpyxl

      - name: Run ruff check
        run: ruff check --config ruff.toml

      - name: Run ruff check format
        run: ruff format --check oeds tests

      - name: Compile
        run: python -m compileall -q oeds tests

      - name: Test bounded imports
        run: python -m unittest discover -s tests -v
